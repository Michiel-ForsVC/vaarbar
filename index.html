<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DE VAARBAR — Bestellingen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --black: #0a0a0a;
    --ink: #14110d;
    --off-white: #f4f1ec;
    --paper: #ebe6dd;
    --gray-mid: #b0a99e;
    --gray-dark: #4a4540;
    --accent: #3d6fd4;
    --accent-dark: #2c54a8;
    --danger: #c0392b;
    --line: #ddd6ca;
  }

  html, body {
    width: 100%; height: 100%; max-width: 100%; overflow-x: hidden;
    background: var(--black);
    font-family: 'DM Sans', sans-serif;
    overflow-y: hidden;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== LAYOUT (tablet 16:10 default) ===== */
  #app {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 60px 1fr;
    height: 100vh; width: 100%; max-width: 100%;
    background: var(--off-white);
  }

  /* ===== HEADER ===== */
  #header {
    grid-column: 1 / -1;
    background: var(--black);
    display: flex; align-items: center;
    padding: 0 18px; gap: 16px;
    z-index: 30;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid #fff; flex-shrink: 0; box-sizing: border-box;
    background: var(--black); display: grid; place-items: center; overflow: hidden;
  }
  .logo svg { width: 100%; height: 100%; display: block; }
  .logo .ct { font-family: 'Bebas Neue', sans-serif; fill: #fff; font-size: 13.5px; letter-spacing: 1px; }
  .logo .anchor { fill: #fff; }
  #header h1 {
    font-family: 'Bebas Neue', sans-serif; color: #fff;
    font-size: 26px; letter-spacing: 3px; line-height: 1;
  }
  #header .sub { color: var(--gray-mid); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-left: auto; }

  /* fullscreen-knop */
  #fsbtn {
    margin-left: 12px; flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 10px;
    border: 1.5px solid #333; background: #181818; color: #fff;
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #fsbtn:active { background: var(--accent); border-color: var(--accent); }
  #fsbtn svg { width: 20px; height: 20px; display: block; }

  /* ===== LEFT: ORDER ENTRY ===== */
  #entry { display: flex; flex-direction: column; min-height: 0; }

  /* tabs */
  #tabs {
    display: flex; gap: 6px; padding: 12px 14px 0; overflow-x: auto;
    scrollbar-width: none; flex-shrink: 0;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1.5px;
    padding: 9px 16px; border: none; cursor: pointer; white-space: nowrap;
    background: var(--paper); color: var(--gray-dark); border-radius: 10px 10px 0 0;
    transition: all .15s; position: relative; top: 1px;
  }
  .tab.fav { display:flex; align-items:center; gap:6px; }
  .tab.fav svg { width:15px; height:15px; }
  .tab.active { background: var(--accent); color: #fff; }
  .tab.active.fav svg path { fill:#fff; }

  /* search */
  #searchwrap { padding: 10px 14px 6px; flex-shrink: 0; }
  #search {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-family: 'DM Sans'; font-size: 15px; background: #fff; color: var(--ink);
    outline: none; transition: border-color .15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--gray-mid); }

  /* grid */
  #gridwrap { flex: 1; overflow-y: auto; padding: 6px 14px 18px; }
  #gridwrap::-webkit-scrollbar { width: 8px; }
  #gridwrap::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px;
    width: 100%;
  }
  .card {
    position: relative; border-radius: 12px; padding: 12px 12px 10px;
    cursor: pointer; user-select: none; min-height: 78px; min-width: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1.5px solid rgba(0,0,0,.14);
    box-shadow: 0 1px 0 rgba(0,0,0,.12), 0 3px 8px rgba(0,0,0,.06);
    transition: transform .08s ease, box-shadow .12s ease;
    overflow: hidden;
  }
  .card::after {
    content:""; position:absolute; inset:0; background:#000; opacity:0;
    transition: opacity .12s; pointer-events:none;
  }
  .card:active { transform: scale(.96); }
  .card.flash::after { opacity:.16; }
  .card .nm {
    font-weight: 600; font-size: 14px; line-height: 1.18; letter-spacing: .1px;
    text-shadow: 0 1px 1px rgba(0,0,0,.08);
  }
  .card .pr {
    align-self: flex-start; margin-top: 8px; font-family:'Bebas Neue'; letter-spacing:1px;
    font-size: 17px; padding: 1px 9px; border-radius: 6px; line-height: 1.35;
  }
  .card .qty {
    position: absolute; top: 7px; right: 7px; min-width: 24px; height: 24px; padding: 0 6px;
    border-radius: 13px; background: var(--accent); color:#fff;
    font-family:'Bebas Neue'; font-size: 15px; letter-spacing:1px;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); border: 2px solid #fff;
  }
  .card.incart .qty { display: flex; }
  .card.incart { outline: 3px solid var(--accent); outline-offset: 1px; }
  .empty-grid { color: var(--gray-mid); font-size: 15px; padding: 30px 6px; grid-column: 1/-1; text-align:center; }

  /* ===== RIGHT: ORDER OVERVIEW ===== */
  #order {
    background: var(--black); color: #fff; display: flex; flex-direction: column; min-height: 0;
  }
  #order h2 {
    font-family:'Bebas Neue'; font-size: 22px; letter-spacing: 2.5px; padding: 16px 18px 10px;
    border-bottom: 1px solid #222; display:flex; justify-content:space-between; align-items:baseline;
  }
  #order h2 .cnt { font-size: 14px; color: var(--gray-mid); letter-spacing:1px; }
  #lines { flex: 1; overflow-y: auto; padding: 6px 12px; }
  #lines::-webkit-scrollbar { width: 7px; }
  #lines::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }
  .line { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid #1c1c1c; }
  .line .swatch { width: 9px; height: 32px; border-radius: 3px; flex-shrink:0; }
  .line .info { flex: 1; min-width: 0; }
  .line .ln { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .lp { font-size: 12px; color: var(--gray-mid); }
  .line .ctrl { display: flex; align-items: center; gap: 8px; flex-shrink:0; }
  .line .ctrl button {
    width: 28px; height: 28px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 18px; font-weight: 700; line-height: 1; display:grid; place-items:center;
    background: #262626; color: #fff; transition: background .12s;
  }
  .line .ctrl button:active { background: var(--accent); }
  .line .ctrl .n { font-family:'Bebas Neue'; font-size: 18px; min-width: 20px; text-align: center; }
  .line .lt { font-family:'Bebas Neue'; font-size: 17px; min-width: 52px; text-align: right; letter-spacing:.5px; }
  .empty-order { color: #555; text-align: center; padding: 40px 20px; font-size: 14px; }

  #foot { border-top: 1px solid #222; padding: 14px 18px 16px; flex-shrink: 0; }
  #total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  #total-row .lbl { font-family:'Bebas Neue'; font-size: 20px; letter-spacing: 2px; color:#fff; }
  #total-row .amt {
    font-family:'Bebas Neue'; font-size: 32px; letter-spacing: 1px; color: #fff;
    background: var(--accent); padding: 4px 16px; border-radius: 10px; line-height: 1.1;
  }
  #newbtn {
    width: 100%; padding: 15px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #fff; font-family:'Bebas Neue'; font-size: 22px; letter-spacing: 3px;
    transition: background .15s;
  }
  #newbtn:active { background: var(--accent-dark); }
  #newbtn:disabled { background:#262626; color:#555; cursor: default; }

  /* mobile order toggle handle (hidden on desktop) */
  #handle { display: none; }

  /* ===== CONFIRM MODAL ===== */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  #modal.show { display: flex; }
  .modal-box {
    background: var(--off-white); border-radius: 16px; padding: 26px 24px; max-width: 340px; width: 100%;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .modal-box h3 { font-family:'Bebas Neue'; font-size: 26px; letter-spacing: 2px; margin-bottom: 8px; }
  .modal-box p { color: var(--gray-dark); font-size: 14px; margin-bottom: 20px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
    font-family:'Bebas Neue'; font-size: 18px; letter-spacing: 1.5px;
  }
  .mb-cancel { background: var(--paper); color: var(--gray-dark); }
  .mb-ok { background: var(--danger); color: #fff; }

  /* ===== MOBILE & PORTRAIT TABLET ===== */
  @media (max-width: 820px), (orientation: portrait) and (max-width: 1200px) {
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: 56px 1fr;
    }
    #entry { min-width: 0; }
    #gridwrap { min-width: 0; }
    #fsbtn { margin-left: auto; }
    #order {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      height: 80vh; border-radius: 20px 20px 0 0;
      transform: translateY(calc(100% - 76px));
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 -8px 30px rgba(0,0,0,.4);
      touch-action: none;
    }
    #order.open { transform: translateY(0); }
    #handle {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px 0 4px; cursor: pointer; flex-shrink: 0;
    }
    #handle .bar { width: 42px; height: 4px; border-radius: 2px; background: #555; margin-bottom: 6px; }
    #handle .peek {
      display: flex; align-items: center; gap: 10px; font-family:'Bebas Neue'; letter-spacing:1.5px;
      font-size: 17px; color:#fff;
    }
    #handle .peek .pill { background: var(--accent); padding: 2px 10px; border-radius: 12px; font-size: 15px; }
    #handle .peek .pk-total { margin-left: auto; color: #fff; background: var(--accent); padding: 1px 10px; border-radius: 10px; }
    #handle .peek { width: 100%; padding: 0 18px; }
    #order h2 { padding-top: 6px; }
    #order.open #handle .bar { background:#777; }
    #grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    #gridwrap { padding-bottom: 96px; }
    #header h1 { font-size: 22px; letter-spacing: 2px; }
    #header .sub { display:none; }
  }
  /* telefoons: altijd precies 2 naast elkaar, nooit breder dan het scherm */
  @media (max-width: 540px) {
    #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="logo" aria-label="De Vaarbar logo">
      <svg viewBox="0 0 100 100">
        <defs>
          <path id="vcirc" d="M 50,50 m -33,0 a 33,33 0 1,1 66,0 a 33,33 0 1,1 -66,0"/>
        </defs>
        <text class="ct"><textPath href="#vcirc" startOffset="0">DE VAARBAR · DE VAARBAR · </textPath></text>
        <path class="anchor" d="M50 34a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-2 9v3h-5v3h5v9c-3-.4-5.3-2-6.5-4l-2.4 1.6C40.8 67.7 44.8 70 50 70s9.2-2.3 10.9-5.4l-2.4-1.6c-1.2 2-3.5 3.6-6.5 4v-9h5v-3h-5v-3z"/>
      </svg>
    </div>
    <h1>DE VAARBAR</h1>
    <span class="sub">Bestelsysteem</span>
    <button id="fsbtn" aria-label="Volledig scherm" title="Volledig scherm"></button>
  </header>

  <section id="entry">
    <div id="tabs"></div>
    <div id="searchwrap">
      <input id="search" type="text" placeholder="Zoek een drankje of hapje…" autocomplete="off">
    </div>
    <div id="gridwrap"><div id="grid"></div></div>
  </section>

  <aside id="order">
    <div id="handle">
      <span class="bar"></span>
      <span class="peek">
        <span class="pill" id="pk-cnt">0</span>
        <span>Bestelling</span>
        <span class="pk-total" id="pk-total">€0,00</span>
      </span>
    </div>
    <h2>Overzicht <span class="cnt" id="ord-cnt">0 items</span></h2>
    <div id="lines"></div>
    <div id="foot">
      <div id="total-row">
        <span class="lbl">Totaal</span>
        <span class="amt" id="total">€0,00</span>
      </div>
      <button id="newbtn" disabled>Nieuw Order</button>
    </div>
  </aside>
</div>

<div id="modal">
  <div class="modal-box">
    <h3>Nieuw order?</h3>
    <p>De huidige bestelling wordt gewist en je begint met een lege bon.</p>
    <div class="modal-btns">
      <button class="mb-cancel" id="m-cancel">Annuleren</button>
      <button class="mb-ok" id="m-ok">Wissen</button>
    </div>
  </div>
</div>

// ---------- helpers ----------
const eur = v => '€' + v.toFixed(2).replace('.', ',');
// relatieve luminantie → kies leesbare tekstkleur
function textOn(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const lin = c => c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
  const L = 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  return L > 0.55 ? '#14110d' : '#ffffff';
}
// unieke sleutel per item (zelfde naam kan in meerdere tabs voorkomen, prijs verschilt soms)
const keyOf = it => it.n + '|' + it.p;

// ---------- state ----------
let activeCat = 0;
const cart = new Map(); // key -> {n,p,c,q}

// ---------- build tabs ----------
const tabsEl = document.getElementById('tabs');
const starSVG = '<svg viewBox="0 0 24 24"><path fill="#d99a2b" d="M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.8 6.1 20.2l1.2-6.6L2.5 9l6.6-.9z"/></svg>';
MENU.forEach((cat, i) => {
  const b = document.createElement('button');
  b.className = 'tab' + (i===0?' active':'') + (i===0?' fav':'');
  b.innerHTML = (i===0 ? starSVG : '') + cat.cat;
  b.onclick = () => { activeCat = i; document.getElementById('search').value=''; renderTabs(); renderGrid(); document.getElementById('gridwrap').scrollTop=0; };
  tabsEl.appendChild(b);
});
function renderTabs(){
  [...tabsEl.children].forEach((b,i)=> b.classList.toggle('active', i===activeCat));
}

// ---------- grid ----------
const gridEl = document.getElementById('grid');
function renderGrid(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let items;
  if (q) {
    // zoek over alle categorieën, behoud volgorde
    const seen = new Set(); items = [];
    MENU.forEach(c => c.items.forEach(it => {
      if (it.n.toLowerCase().includes(q)) { const k=keyOf(it); if(!seen.has(k)){seen.add(k); items.push(it);} }
    }));
  } else {
    items = MENU[activeCat].items;
  }
  gridEl.innerHTML = '';
  if (!items.length){ gridEl.innerHTML = '<div class="empty-grid">Geen resultaten gevonden.</div>'; return; }
  items.forEach(it => {
    const k = keyOf(it);
    const fg = textOn(it.c);
    const inCart = cart.has(k);
    const card = document.createElement('div');
    card.className = 'card' + (inCart?' incart':'');
    if (it.f) {
      const hatch = fg==='#ffffff' ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.08)';
      card.style.backgroundColor = it.c;
      card.style.backgroundImage = 'repeating-linear-gradient(45deg,'+hatch+' 0 6px, transparent 6px 13px)';
    } else {
      card.style.background = it.c;
    }
    card.style.color = fg;
    const prBg = fg==='#ffffff' ? 'rgba(0,0,0,.28)' : 'rgba(255,255,255,.55)';
    card.innerHTML =
      '<span class="qty">'+(inCart?cart.get(k).q:0)+'</span>' +
      '<span class="nm">'+it.n+'</span>' +
      '<span class="pr" style="background:'+prBg+'">'+eur(it.p)+'</span>';
    card.onclick = () => { add(it); card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'),140); };
    gridEl.appendChild(card);
  });
}

// ---------- cart ops ----------
function add(it){
  const k = keyOf(it);
  if (cart.has(k)) cart.get(k).q++;
  else cart.set(k, {n:it.n, p:it.p, c:it.c, q:1});
  renderOrder(); syncGridQty();
}
function changeQty(k, d){
  const e = cart.get(k); if(!e) return;
  e.q += d; if (e.q<=0) cart.delete(k);
  renderOrder(); syncGridQty();
}
function syncGridQty(){
  [...gridEl.children].forEach(card=>{
    const nm = card.querySelector('.nm'); if(!nm) return;
    // herrender enkel badges/outline via volledige grid-refresh is duur; doe gericht
  });
  renderGrid(); // eenvoudig en betrouwbaar voor deze schaal
}

// ---------- order panel ----------
const linesEl = document.getElementById('lines');
function renderOrder(){
  linesEl.innerHTML = '';
  let total = 0, count = 0;
  if (cart.size === 0){
    linesEl.innerHTML = '<div class="empty-order">Nog geen items.<br>Tik op een drankje om te starten.</div>';
  }
  cart.forEach((e,k)=>{
    total += e.p*e.q; count += e.q;
    const row = document.createElement('div');
    row.className = 'line';
    row.innerHTML =
      '<span class="swatch" style="background:'+e.c+'"></span>' +
      '<div class="info"><div class="ln">'+e.n+'</div><div class="lp">'+eur(e.p)+' / stuk</div></div>' +
      '<div class="ctrl"><button data-m="-1">−</button><span class="n">'+e.q+'</span><button data-m="1">+</button></div>' +
      '<span class="lt">'+eur(e.p*e.q)+'</span>';
    row.querySelector('[data-m="-1"]').onclick = ()=>changeQty(k,-1);
    row.querySelector('[data-m="1"]').onclick  = ()=>changeQty(k, 1);
    linesEl.appendChild(row);
  });
  document.getElementById('total').textContent = eur(total);
  document.getElementById('ord-cnt').textContent = count + (count===1?' item':' items');
  document.getElementById('pk-cnt').textContent = count;
  document.getElementById('pk-total').textContent = eur(total);
  document.getElementById('newbtn').disabled = cart.size===0;
}

// ---------- nieuw order ----------
const modal = document.getElementById('modal');
document.getElementById('newbtn').onclick = ()=>{ if(cart.size) modal.classList.add('show'); };
document.getElementById('m-cancel').onclick = ()=> modal.classList.remove('show');
document.getElementById('m-ok').onclick = ()=>{ cart.clear(); renderOrder(); renderGrid(); modal.classList.remove('show'); activeCat=0; renderTabs(); renderGrid(); };
modal.onclick = e => { if(e.target===modal) modal.classList.remove('show'); };

// ---------- search ----------
const searchEl = document.getElementById('search');
searchEl.addEventListener('input', renderGrid);

// begin typen op een fysiek toetsenbord activeert meteen de zoekbalk
document.addEventListener('keydown', (e) => {
  if (document.activeElement === searchEl) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (modal.classList.contains('show')) return;
  if (e.key && e.key.length === 1) {       // enkel printbare tekens
    searchEl.focus();                       // het teken belandt vanzelf in het veld
  } else if (e.key === 'Escape') {
    searchEl.value = ''; renderGrid(); searchEl.blur();
  }
});

// ---------- fullscreen ----------
const fsbtn = document.getElementById('fsbtn');
const fsEnterIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>';
const fsExitIcon  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v4a1 1 0 0 1-1 1H4M15 4v4a1 1 0 0 0 1 1h4M9 20v-4a1 1 0 0 0-1-1H4M15 20v-4a1 1 0 0 1 1-1h4"/></svg>';
function inFullscreen(){ return document.fullscreenElement || document.webkitFullscreenElement; }
function updateFsIcon(){ fsbtn.innerHTML = inFullscreen() ? fsExitIcon : fsEnterIcon; }
fsbtn.addEventListener('click', () => {
  if (inFullscreen()){
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  } else {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  }
});
document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);
updateFsIcon();

// ---------- mobile bottom sheet ----------
const orderEl = document.getElementById('order');
const handle = document.getElementById('handle');
let startY=null, startOpen=false;
handle.addEventListener('click', e=>{ if(dragMoved) return; orderEl.classList.toggle('open'); });
let dragMoved=false;
function onStart(y){ startY=y; startOpen=orderEl.classList.contains('open'); dragMoved=false; orderEl.style.transition='none'; }
function onMove(y){
  if(startY===null) return; const dy=y-startY; if(Math.abs(dy)>6) dragMoved=true;
  const h=orderEl.offsetHeight; const base= startOpen?0:(h-76);
  let t=base+dy; t=Math.max(0,Math.min(h-76,t)); orderEl.style.transform='translateY('+t+'px)';
}
function onEnd(y){
  if(startY===null) return; orderEl.style.transition=''; orderEl.style.transform='';
  const dy=y-startY;
  if(dragMoved){ if(dy<-40) orderEl.classList.add('open'); else if(dy>40) orderEl.classList.remove('open'); else orderEl.classList.toggle('open', startOpen); }
  startY=null;
}
handle.addEventListener('touchstart',e=>onStart(e.touches[0].clientY),{passive:true});
handle.addEventListener('touchmove', e=>{onMove(e.touches[0].clientY); e.preventDefault();},{passive:false});
handle.addEventListener('touchend', e=>onEnd(e.changedTouches[0].clientY));

// ---------- init ----------
renderTabs(); renderGrid(); renderOrder();
</script>
